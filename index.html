<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahmoud Morsi Gym</title>
<style>
  :root{
    --bg: #000000;
    --text: #ffffff;
    --muted: #8a8a8a;
    --line: rgba(255,255,255,0.12);
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px;
  }
  .card{
    width:100%;
    max-width: 380px;
    text-align:center;
  }
  .logo{
    width: 150px;
    height: 150px;
    object-fit: contain;
    margin: 0 auto 28px;
    display:block;
  }
  h1{
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  p.subtitle{
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 36px;
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding: 17px 20px;
    background: #ffffff;
    color: #000000;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.3px;
    border: 2px solid #ffffff;
    border-radius: 50px;
    text-decoration:none;
    transition: background .2s ease, color .2s ease, transform .1s ease;
  }
  .btn:hover{ background: transparent; color: #ffffff; }
  .btn:active{ transform: scale(0.98); }
  .btn svg{ width:20px; height:20px; flex-shrink:0; }
  .divider{
    width: 40px;
    height: 2px;
    background: var(--line);
    margin: 28px auto;
  }
  .note{
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.3px;
  }
</style>
</head>
